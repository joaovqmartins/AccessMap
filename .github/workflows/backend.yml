name: Backend

# Testes da API (unitários e de integração com Testcontainers) em todo PR e push na main.
# Só roda quando algo do backend (ou este arquivo) muda.
on:
  pull_request:
    paths:
      - 'AccessMap.Back/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'AccessMap.Back/**'
      - '.github/workflows/backend.yml'

# Um push novo no mesmo PR cancela a execução anterior
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mvnw test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AccessMap.Back
    steps:
      - uses: actions/checkout@v4

      # Mesma versão do <java.version> do pom.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # O Testcontainers usa o Docker que já vem no ubuntu-latest; o perfil de teste
      # (application-test.yaml) traz o segredo do JWT e os limites próprios.
      - name: Testes
        run: ./mvnw -B -ntp test

      - name: Relatórios dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: AccessMap.Back/target/surefire-reports/
          retention-days: 7
