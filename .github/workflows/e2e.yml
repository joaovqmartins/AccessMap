name: E2E

# Testes e2e do Playwright (#128) contra um banco próprio e vazio, com a API (perfil e2e) e o app web
# subidos pelo webServer do playwright.config.ts. Roda quando o app, a API ou este arquivo mudam.
on:
  pull_request:
    paths:
      - 'AccessMap.Front/**'
      - 'AccessMap.Back/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'AccessMap.Front/**'
      - 'AccessMap.Back/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Mesmo banco do serviço postgres-e2e do docker-compose.yml (porta 5433, accessmap_e2e)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: accessmap_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accessmap_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: AccessMap.Front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AccessMap.Front/package-lock.json

      - name: Dependências do app
        run: npm ci

      # Baixa o backend antes, para o tempo de download não estourar o timeout do webServer
      - name: Dependências da API
        working-directory: AccessMap.Back
        run: ./mvnw -B -ntp -q dependency:go-offline

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      # Sobe a API (8090) e o app web (8091) pelo webServer e roda a suíte
      - name: Testes e2e
        run: npx playwright test

      - name: Relatório, prints e capturas de falha
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: AccessMap.Front/e2e-results/
          retention-days: 7
