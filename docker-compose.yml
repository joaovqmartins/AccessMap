# Apenas infraestrutura (bancos, cache, filas). A aplicacao roda pela IDE:
# backend pelo Run do IntelliJ (que sobe este compose sozinho) e front pelo VS Code.
services:
  postgres:
    image: postgres:16
    container_name: accessmap-db
    environment:
      POSTGRES_DB: accessmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: accessmap123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accessmap"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
