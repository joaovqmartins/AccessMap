# Apenas infraestrutura (bancos, cache, filas). A aplicacao roda pela IDE:
# backend pelo Run do IntelliJ (que sobe este compose sozinho) e front pelo VS Code.
services:
  postgres:
    image: postgres:16
    container_name: accessmap-db
    environment:
      # Mesmas variaveis da API (.env da raiz); sem elas, os valores do banco local de desenvolvimento
      POSTGRES_DB: accessmap
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-accessmap123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d accessmap"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Banco só dos testes e2e (#128). Fica fora do "docker compose up" normal (profile e2e) e começa
  # vazio a cada subida (dados em memória), sem tocar no banco de desenvolvimento acima.
  # Subir: docker compose --profile e2e up -d --wait postgres-e2e  (o "npm run e2e:ci" já faz isso)
  postgres-e2e:
    image: postgres:16
    container_name: accessmap-db-e2e
    profiles: [e2e]
    environment:
      POSTGRES_DB: accessmap_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accessmap_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
