spring:
  docker:
    compose:
      # Ao rodar pela IDE, sobe o Postgres do docker-compose.yml e mantem no ar ao parar a API.
      file: ../docker-compose.yml
      lifecycle-management: start-only
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accessmap}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:accessmap123}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: 8080

accessmap:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: accessmap
  cors:
    # Vazio desliga o CORS. So para o app no navegador em desenvolvimento.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

---
# Le o .env da raiz (rodando de backend/ ou da raiz). Variaveis de ambiente reais tem prioridade.
# Fora do perfil de teste: os testes nao podem depender do .env de quem esta rodando.
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
