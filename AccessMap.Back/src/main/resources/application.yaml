spring:
  docker:
    compose:
      # Ao rodar pela IDE, sobe o Postgres do docker-compose.yml e mantem no ar ao parar a API.
      file: ../docker-compose.yml
      lifecycle-management: start-only
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accessmap}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:accessmap123}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: 8080
  # "native" so atras de um proxy confiavel (deploy): sem proxy, o cliente falsificaria o IP pelo X-Forwarded-For.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

accessmap:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: accessmap
  cors:
    # Vazio desliga o CORS. So para o app no navegador em desenvolvimento.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    rate-limit:
      window: ${AUTH_LIMIT_WINDOW:15m}
      login-per-phone: ${AUTH_LIMIT_LOGIN_PER_PHONE:5}
      login-per-ip: ${AUTH_LIMIT_LOGIN_PER_IP:20}
      register-per-ip: ${AUTH_LIMIT_REGISTER_PER_IP:10}
  review:
    # Valores provisorios ate as regras da #27. Trocar aqui ou pelas variaveis nao exige mudar codigo.
    rate-limit:
      per-hour: ${REVIEW_LIMIT_PER_HOUR:5}
      per-day: ${REVIEW_LIMIT_PER_DAY:20}
      new-account-per-hour: ${REVIEW_LIMIT_NEW_ACCOUNT_PER_HOUR:3}
      new-account-per-day: ${REVIEW_LIMIT_NEW_ACCOUNT_PER_DAY:10}
      new-account-period: ${REVIEW_LIMIT_NEW_ACCOUNT_PERIOD:7d}
    # Regras da #27. Trocar um peso aqui nao exige migrar dados: a review guarda o nivel, nao o peso.
    trust:
      trusted-min-age: 30d
      trusted-min-published: 5
      moderation-window: 90d
      restricted-removals: 2
      weight-restricted: 0.25
      weight-new: 0.5
      weight-regular: 1.0
      weight-trusted: 1.5

---
# Le o .env da raiz (rodando de AccessMap.Back/ ou da raiz). Variaveis de ambiente reais tem prioridade.
# Fora do perfil de teste: os testes nao podem depender do .env de quem esta rodando.
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
