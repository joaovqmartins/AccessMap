# Perfil de producao (SPRING_PROFILES_ACTIVE=prod, padrao da imagem Docker). Guia: docs/deploy.md.
# Banco sem valor padrao de proposito: faltando a variavel, a API nao sobe, em vez de subir apontando
# para o banco local de desenvolvimento.
spring:
  docker:
    compose:
      # Nao existe Docker dentro do container de producao
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

# Logs de producao (#132): INFO para a API, e o Hibernate so em WARN para nao registrar SQL nem
# os valores dos parametros (telefone, hash de senha). Trocar por variavel sem novo deploy da imagem.
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    br.com.accessmap: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

server:
  port: ${PORT:8080}
  # Atras do proxy do Railway: sem isso, o limite de login por IP veria todo mundo como um IP so (#107)
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

accessmap:
  mail:
    # Sem BREVO_API_KEY o codigo de recuperacao de senha nao pode aparecer no log de producao
    log-content: false
